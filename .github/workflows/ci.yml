name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-linux-amd64:
    name: Test (Linux AMD64, Go ${{ matrix.go-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go-version: ['1.24', '1.25', '1.26', 'stable']
    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Setup Go
      uses: actions/setup-go@v6
      with:
        go-version: ${{ matrix.go-version }}

    - name: Print Go version
      run: go version

    - name: Download dependencies
      run: go mod download

    - name: Run unit tests
      run: make test

  test-nondec:
    # The pure-Go engine (vj_nondec) is plain Go, so one OS/arch stands in for
    # every platform. Its exposure is to the runtime internals gort links
    # against (swissmap and noswissmap layouts), so it spans the oldest
    # supported toolchain and the newest.
    name: Test (pure-Go decoder, Go ${{ matrix.go-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go-version: ['1.24', 'stable']
    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Setup Go
      uses: actions/setup-go@v6
      with:
        go-version: ${{ matrix.go-version }}

    - name: Print Go version
      run: go version

    - name: Download dependencies
      run: go mod download

    - name: Run unit tests
      run: make test-nondec

  test-linux-arm64:
    name: Test (Linux ARM64, Go stable)
    runs-on: ubuntu-24.04-arm
    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Setup Go
      uses: actions/setup-go@v6
      with:
        go-version: stable

    - name: Print Go version
      run: go version

    - name: Download dependencies
      run: go mod download

    - name: Run unit tests
      run: make test

  cross-compile:
    # Platforms without a native decoder blob. The pure-Go core keeps the
    # library buildable there; this only checks compilation. Two targets
    # cover the full delta versus tested platforms: s390x (also big-endian)
    # compiles the ndec/encvm stubs gated on !(amd64 || arm64); freebsd
    # compiles the execblob fallback gated on !darwin && !linux && !windows.
    # All other GOOS/GOARCH combinations select an identical file set.
    name: Cross-compile (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: s390x }
          - { goos: freebsd, goarch: amd64 }
    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Setup Go
      uses: actions/setup-go@v6
      with:
        go-version: stable

    - name: Print Go version
      run: go version

    - name: Download dependencies
      run: go mod download

    - name: Build
      run: GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build ./...

  test-macos:
    name: Test (macOS ARM64, Go stable)
    runs-on: macos-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Setup Go
      uses: actions/setup-go@v6
      with:
        go-version: stable

    - name: Print Go version
      run: go version

    - name: Download dependencies
      run: go mod download

    - name: Run unit tests
      run: make test

  test-macos-amd64:
    # GitHub retired the last Intel macOS hosted runner (macos-13) in December
    # 2025, but the arm64 images ship Rosetta 2, so GOARCH=amd64 still builds
    # and executes darwin/amd64 binaries under translation. execblob loads the
    # arch-canonical linux-built amd64 ELF blob through the darwin/amd64 mmap
    # path (native/execblob/execmap_darwin_amd64.go), so this is the only
    # runner that exercises it.
    name: Test (macOS AMD64 via Rosetta, Go stable)
    runs-on: macos-latest
    env:
      GOARCH: amd64
    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Setup Go
      uses: actions/setup-go@v6
      with:
        go-version: stable

    - name: Print Go version
      run: go version

    - name: Download dependencies
      run: go mod download

    - name: Run unit tests
      run: make test

  test-windows:
    name: Test (Windows, Go ${{ matrix.go-version }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        go-version: ['1.24', '1.25', '1.26', 'stable']
    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Setup Go
      uses: actions/setup-go@v6
      with:
        go-version: ${{ matrix.go-version }}

    - name: Print Go version
      run: go version

    - name: Download dependencies
      run: go mod download

    - name: Run unit tests
      run: .\scripts\run-test.ps1

  test-windows-arm64:
    # execblob loads the arch-canonical linux-built arm64 ELF blob through
    # the windows VirtualAlloc mmap path (native/execblob/execmap_windows.go,
    # arch-agnostic) and the OS-agnostic arm64 trampolines, so this is the
    # only runner that exercises windows/arm64 end to end.
    name: Test (Windows ARM64, Go stable)
    runs-on: windows-11-arm
    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Setup Go
      uses: actions/setup-go@v6
      with:
        go-version: stable

    - name: Print Go version
      run: go version

    - name: Download dependencies
      run: go mod download

    - name: Run unit tests
      run: .\scripts\run-test.ps1

  # Two halves of the same GC-safety gate, split so their budgets do not add up
  # on one runner. gc-soak buys attempts of the reproduction window; gc-stress
  # buys a collector that checks itself.
  #
  # Runners are every OS/arch combination where `go test -race` actually works
  # (internal/platform.RaceDetectorSupported): windows only ever supports race
  # on amd64, never arm64, so windows/arm64 cannot join this gate regardless of
  # execblob support. Windows/amd64 runs gc-stress.sh through Git Bash (the
  # shell every windows-latest image ships): the script is invoked as `bash
  # scripts/gc-stress.sh` rather than relying on the executable bit, since
  # NTFS carries no POSIX mode to preserve across checkout. macOS AMD64 runs
  # on the arm64 image through Rosetta 2 (GOARCH=amd64), since GitHub retired
  # the last Intel macOS runner image in December 2025.
  gc-soak:
    name: GC Soak (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    # Budget is mostly soak runtime; the rest is build plus drain.
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
        - name: Linux AMD64
          runner: ubuntu-latest
        - name: Linux ARM64
          runner: ubuntu-24.04-arm
        - name: macOS ARM64
          runner: macos-latest
        - name: macOS AMD64
          runner: macos-latest
          goarch: amd64
        - name: Windows AMD64
          runner: windows-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Setup Go
      uses: actions/setup-go@v6
      with:
        go-version: stable

    - name: Download dependencies
      run: go mod download

    # Replays the concurrent unmarshal reproducer from
    # .local/issues/crash-reproduce-1.sh under GOGC=1, cold parser, race, in
    # oversubscribed parallel processes until the budget runs out. Reproduction
    # probability scales with cores and wall clock, so a runner with 4 cores
    # needs the full 12 minutes to approach one round on a 14-core dev box.
    - name: Run GC soak
      shell: bash
      run: bash scripts/gc-stress.sh
      env:
        GC_STRESS_LEGS: soak
        GC_STRESS_SOAK_MINUTES: 12
        GOARCH: ${{ matrix.goarch }}

    - name: Upload GC soak logs
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: gc-soak-logs-${{ matrix.name }}
        path: build/gc-stress/*.log
        retention-days: 30

  gc-stress:
    name: GC Stress (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    # One pass over the suite legs is ~6min on a fast local box; CI cores are
    # fewer and the race legs scale with them. The real hang guard is the
    # per-process -test.timeout inside the script.
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
        - name: Linux AMD64
          runner: ubuntu-latest
        - name: Linux ARM64
          runner: ubuntu-24.04-arm
        - name: macOS ARM64
          runner: macos-latest
        - name: macOS AMD64
          runner: macos-latest
          goarch: amd64
        - name: Windows AMD64
          runner: windows-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Setup Go
      uses: actions/setup-go@v6
      with:
        go-version: stable

    - name: Download dependencies
      run: go mod download

    # Runs the GC-sensitive suites under GOGC=1 + gccheckmark + clobberfree, so a
    # pointer the binder publishes without keeping it scannable fails here rather
    # than as a rare crash in a user's process.
    - name: Run GC stress
      shell: bash
      run: bash scripts/gc-stress.sh
      env:
        GC_STRESS_LEGS: cold pooled encode
        GOARCH: ${{ matrix.goarch }}

    - name: Upload GC stress logs
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: gc-stress-logs-${{ matrix.name }}
        path: build/gc-stress/*.log
        retention-days: 30

  # The pure-Go engine publishes through the same allocator and string arena
  # as the native binder, so its publication windows get the same hostile
  # collector. The engine is plain Go (see test-nondec), so one runner stands
  # in for every platform and the per-platform suite jobs stay on budget.
  gc-stress-nondec:
    name: GC Stress (pure-Go decoder)
    runs-on: ubuntu-latest
    # The decode/bind suite under the hostile collector is the long pole
    # (about 16min under race on a fast box, a fraction of that without),
    # with the per-process -test.timeout inside the script as the hang guard.
    timeout-minutes: 45
    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Setup Go
      uses: actions/setup-go@v6
      with:
        go-version: stable

    - name: Download dependencies
      run: go mod download

    - name: Run GC stress
      shell: bash
      run: bash scripts/gc-stress.sh
      env:
        GC_STRESS_LEGS: nondec
        GC_STRESS_TIMEOUT: 30m

    - name: Upload GC stress logs
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: gc-stress-nondec-logs
        path: build/gc-stress/*.log
        retention-days: 30

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Setup Go
      uses: actions/setup-go@v6
      with:
        go-version: stable

    - name: Run golangci-lint
      uses: golangci/golangci-lint-action@v9
      with:
        version: latest

  fuzz:
    name: Fuzz (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
        - FuzzMarshalString
        - FuzzMarshalStruct
        - FuzzMarshalNoCrash
        - FuzzUnmarshalAny
        - FuzzUnmarshalNumber
        - FuzzUnmarshalStruct
        - FuzzUnmarshalNested
        - FuzzNoCrash
    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Setup Go
      uses: actions/setup-go@v6
      with:
        go-version: stable

    - name: Restore fuzz cache
      uses: actions/cache@v5
      with:
        path: ~/.cache/go-build/fuzz
        key: fuzz-corpus-${{ matrix.target }}-${{ github.sha }}
        restore-keys: |
          fuzz-corpus-${{ matrix.target }}-

    - name: Run ${{ matrix.target }}
      run: go test -fuzz=${{ matrix.target }} -fuzztime=5m -timeout=10m .

    - name: Upload crash artifacts
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: fuzz-crash-${{ matrix.target }}
        path: testdata/fuzz/${{ matrix.target }}/
        retention-days: 30

  # The root-package fuzz targets drive the native engine on every platform
  # that ships the blob, so the pure-Go decoder never sees a fuzz corpus.
  # These legs run the decode-side targets under vj_nondec; the marshal-only
  # targets exercise the same encoder as the native build and stay out.
  fuzz-nondec:
    name: Fuzz pure-Go decoder (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
        - FuzzUnmarshalAny
        - FuzzUnmarshalNumber
        - FuzzUnmarshalStruct
        - FuzzUnmarshalNested
        - FuzzNoCrash
    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Setup Go
      uses: actions/setup-go@v6
      with:
        go-version: stable

    - name: Restore fuzz cache
      uses: actions/cache@v5
      with:
        path: ~/.cache/go-build/fuzz
        key: fuzz-corpus-nondec-${{ matrix.target }}-${{ github.sha }}
        restore-keys: |
          fuzz-corpus-nondec-${{ matrix.target }}-

    - name: Run ${{ matrix.target }}
      run: go test -tags vj_nondec -fuzz=${{ matrix.target }} -fuzztime=5m -timeout=10m .

    - name: Upload crash artifacts
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: fuzz-nondec-crash-${{ matrix.target }}
        path: testdata/fuzz/${{ matrix.target }}/
        retention-days: 30

  pr-check:
    name: PR Check
    runs-on: ubuntu-latest
    needs: [test-linux-amd64, test-nondec, test-linux-arm64, test-macos, test-macos-amd64, test-windows, test-windows-arm64, gc-soak, gc-stress, gc-stress-nondec, lint, fuzz, fuzz-nondec]
    if: always() && github.event_name == 'pull_request'
    steps:
    - name: Check all jobs passed
      run: |
        if [[ "${{ needs.test-linux-amd64.result }}" != "success" || \
              "${{ needs.test-nondec.result }}" != "success" || \
              "${{ needs.test-linux-arm64.result }}" != "success" || \
              "${{ needs.test-macos.result }}" != "success" || \
              "${{ needs.test-macos-amd64.result }}" != "success" || \
              "${{ needs.test-windows.result }}" != "success" || \
              "${{ needs.test-windows-arm64.result }}" != "success" || \
              "${{ needs.gc-soak.result }}" != "success" || \
              "${{ needs.gc-stress.result }}" != "success" || \
              "${{ needs.gc-stress-nondec.result }}" != "success" || \
              "${{ needs.lint.result }}" != "success" || \
              "${{ needs.fuzz.result }}" != "success" || \
              "${{ needs.fuzz-nondec.result }}" != "success" ]]; then
          echo "::error::PR checks failed. All tests, GC stress, lint, and fuzz must pass before merging."
          exit 1
        fi
        echo "All PR checks passed!"
