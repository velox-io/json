version: "2"
run:
  tests: true
linters:
  enable:
  - gosec
  - misspell
  - revive
  settings:
    errcheck:
      check-type-assertions: false
      check-blank: false
    gosec:
      excludes:
      - G104
      - G304
      - G115
    govet:
      disable:
      - fieldalignment
      enable-all: true
    misspell:
      locale: US
    revive:
      rules:
      - name: blank-imports
      - name: context-as-argument
      - name: context-keys-type
      - name: dot-imports
      - name: error-return
      - name: error-strings
      - name: error-naming
      - name: exported
      - name: if-return
      - name: increment-decrement
      - name: var-naming
      - name: var-declaration
      - name: package-comments
      - name: range
      - name: receiver-naming
      - name: time-naming
      - name: unexported-return
      - name: indent-error-flow
  exclusions:
    generated: lax
    presets:
    - comments
    - common-false-positives
    - legacy
    - std-error-handling
    rules:
    - linters:
      - govet
      path: ndec/typeinfo_promote_test\.go
      text: 'repeats json tag'
    - linters:
      - errcheck
      - gosec
      path: _test\.go
    - linters:
      - gosec
      path: benchmark/
    - linters:
      - gosec
      text: 'G103:'
    - linters:
      - errcheck
      text: type assertion
    # `,embed` is a vjson extension; staticcheck only knows encoding/json options.
    - linters:
      - staticcheck
      text: 'SA5008:.*unknown `embed` tag option'
    # The invalid `,string` shapes in this file are the subject under test.
    - linters:
      - staticcheck
      path: decode/bind/string_tag_test\.go
      text: 'SA5008:.*`string` tag option'
    # The explicit embedded-field selector is the promotion path under test.
    - linters:
      - staticcheck
      path: tests/embed_option_test\.go
      text: 'QF1008'
    # Fields in these files pin ABI/runtime-mirror layouts, not Go-level state.
    - linters:
      - unused
      text: 'field '
      path: ^(gort/mapalloc|vbind/typetree|native/ndec/abi|ndec/ndec)\.go$
    # Tag-gated stubs; their call sites compile only under -tags vbindstats.
    - linters:
      - unused
      path: vbind/stats_off\.go
    paths:
    - third_party$
    - builtin$
    - examples/
    - local
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  new: false
formatters:
  enable:
  - gofmt
  - goimports
  exclusions:
    generated: lax
    paths:
    - third_party$
    - builtin$
    - examples/
